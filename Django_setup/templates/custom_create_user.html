<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <form action="{% url 'user_custom_create' %}" method="post">
            {% csrf_token %}
            {% for message in messages %}
                {% if message.tags == "success" %}
                <p style="color:green;">{{ message }}</p>
                {% else %}
                <p style="color:red;">{{ message }}</p>
                {% endif %}
            {% endfor %}

            <label for="username">
                <span>Username:</span>
            </label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required />

            <label for="password">
                <span>Password:</span>
            </label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required />

            <label for="confirm_password">
                <span>Confirm Password:</span>
            </label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm password"
                required />

            <label for="email">
                <span>Email:</span>
            </label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter email"
                required />

            <button type="submit">Create User</button>
        </form>
    </div>
</body>
</html>
